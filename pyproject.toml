[project]
name = "fastapi-starter"
version = "0.1.0"
description = "FastAPI 求职练手参考项目：异步 SQLAlchemy + JWT + pytest + Docker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.14.1",
    "redis>=8.2.0",
]

[project.optional-dependencies]
# 预留：以后要发布给别人用时，可以在这里加 extra（如 "postgres"）。
# 注意：extras 默认**不会**被 uv sync 安装，要 `uv sync --extra postgres`。
dev-legacy = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# alembic 自动生成的迁移文件不参与 lint/format
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数是推荐写法

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
# ⚠️ uv sync 默认只装 main dependencies + 这个 dev 组。
# 以前放在 [project.optional-dependencies].dev 里是**错的**（extra 不默认装），
# 导致干净环境/CI 里没有 ruff、pytest-asyncio —— CI 一跑就红。
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.41.0",
]

[tool.coverage.run]
# SQLAlchemy async 内部用 greenlet 切换，默认只追踪 thread 会漏掉 await 之后的代码
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
